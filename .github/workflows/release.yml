# Pushing a tag like v0.2.0 tests and builds the signed phone and watch APKs and attaches them to a DRAFT release.
# Publishing the draft (on GitHub) is what makes it the latest release the app offers as an update.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs with the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare pinned Phonon runtime and Zoey pack
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          sdkmanager "ndk;29.0.14206865"
          rustup default stable
          cargo install --locked cargo-ndk --version 4.1.2
          python3 -m unittest discover -s scripts/voice -p 'test_*.py'
          bash scripts/voice/build_phonon_android.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: >
          ./gradlew --no-daemon
          :shared:core:testAndroidHostTest :shared:designsystem:testAndroidHostTest :shared:ui:testAndroidHostTest :shared:wearlink:testAndroidHostTest
          :wearApp:testDebugUnitTest :androidApp:assembleRelease :wearApp:assembleRelease
          -PappVersion="${GITHUB_REF_NAME#v}" -PreleasesRepo="$GITHUB_REPOSITORY"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # The universal APK keeps the name every release had; one APK per ABI, about a third of its size, goes
        # beside it after an underscore (herald-1.2.3_arm64-v8a.apk). GitHub lists assets by name and app versions
        # up to 0.5.1 offer the first APK listed, so the universal one must sort first: "." comes before "_".
        # The Wear OS app is herald-wear-1.2.3.apk, which sorts after them all and which the app never offers.
        run: |
          v="${GITHUB_REF_NAME#v}"
          out=androidApp/build/outputs/apk/release
          cp "$out/androidApp-universal-release.apk" "herald-$v.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do cp "$out/androidApp-$abi-release.apk" "herald-${v}_$abi.apk"; done
          cp wearApp/build/outputs/apk/release/wearApp-release.apk "herald-wear-$v.apk"
          for apk in herald-*.apk; do sha256sum "$apk" > "$apk.sha256"; done
          # Above the generated changelog: which APK to take.
          cat > which-apk.md <<EOF
          ### Which APK?

          | Your device | Download |
          |---|---|
          | **Almost any phone or tablet** (64-bit ARM, nearly every phone since 2017) | \`herald-${v}_arm64-v8a.apk\` |
          | An older or low-cost 32-bit phone | \`herald-${v}_armeabi-v7a.apk\` |
          | An emulator or Chromebook with an Intel or AMD chip | \`herald-${v}_x86_64.apk\` |
          | A 32-bit Intel or AMD device | \`herald-${v}_x86.apk\` |
          | Not sure | \`herald-$v.apk\`: runs on all of them, about 2.7× the size |

          Once Herald is installed, its update banner downloads the right one by itself.

          **Wear OS watch:** \`herald-wear-$v.apk\`. Install it on the watch with \`adb install\` (Developer options → Wireless debugging); it pairs with Herald on the phone by itself. Update it the same way.
          EOF
          gh release create "$GITHUB_REF_NAME" "herald-$v.apk" "herald-$v.apk.sha256" --draft --generate-notes --notes-file which-apk.md --title "$GITHUB_REF_NAME"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do gh release upload "$GITHUB_REF_NAME" "herald-${v}_$abi.apk" "herald-${v}_$abi.apk.sha256"; done
          gh release upload "$GITHUB_REF_NAME" "herald-wear-$v.apk" "herald-wear-$v.apk.sha256"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
