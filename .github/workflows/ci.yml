# Tests and a debug build for every push and pull request.
# The only secret is GRADLE_ENCRYPTION_KEY (`openssl rand -base64 16`), which lets the configuration
# cache be saved between runs. Without it (forks, or before it's set) the build still works, just slower.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prepare pinned Phonon runtime and Zoey pack
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          sdkmanager "ndk;29.0.14206865"
          rustup default stable
          cargo install --locked cargo-ndk --version 4.1.2
          python3 -m unittest discover -s scripts/voice -p 'test_*.py'
          bash scripts/voice/build_phonon_android.sh

      # Lint fails on any issue that isn't in androidApp/lint-baseline.xml. --continue reports the tests and
      # lint together instead of stopping at the first failure.
      - name: Test, build and lint
        run: >
          ./gradlew --no-daemon --continue
          :shared:core:testAndroidHostTest :shared:designsystem:testAndroidHostTest :shared:ui:testAndroidHostTest :shared:wearlink:testAndroidHostTest
          :androidApp:assembleDebug :androidApp:lintDebug :wearApp:testDebugUnitTest :wearApp:assembleDebug :wearApp:lintDebug

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: |
            androidApp/build/reports/lint-results-debug.html
            wearApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore
